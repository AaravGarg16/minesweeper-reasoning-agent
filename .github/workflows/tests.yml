name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The README claims 3.10+. The annotations use `X | None`, which
        # 3.9 rejects on import, so this matrix is what checks that claim.
        python: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Service dependencies, where there are any.
          if [ -f requirements-api.txt ]; then
            pip install -r requirements-api.txt
          fi
          # Test dependencies, otherwise just pytest.
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install pytest
          fi

      - name: Run the tests
        run: pytest -q
